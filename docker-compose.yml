services:
  db:
    image: mariadb:10.11
    container_name: rocket-mariadb
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-rocket_db}
      MYSQL_USER: ${DB_USER:-rocket}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rocketpassword}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rocket-frontend
    environment:
      APP_MODE: frontend
      DATABASE_URL: mysql://${DB_USER:-rocket}:${DB_PASSWORD:-rocketpassword}@db:3306/${DB_NAME:-rocket_db}
      SECRET_KEY: ${SECRET_KEY:-ZuVdZ0uqaLYeICWBVMmm39yKiy63sE7HW9vpISsIT2w=}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RUST_LOG: ${RUST_LOG:-info}
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 8000
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY:-ZuVdZ0uqaLYeICWBVMmm39yKiy63sE7HW9vpISsIT2w=}
      ROCKET_ENV: ${ROCKET_ENV:-development}
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rocket-admin
    environment:
      APP_MODE: admin
      DATABASE_URL: mysql://${DB_USER:-rocket}:${DB_PASSWORD:-rocketpassword}@db:3306/${DB_NAME:-rocket_db}
      SECRET_KEY: ${SECRET_KEY:-ZuVdZ0uqaLYeICWBVMmm39yKiy63sE7HW9vpISsIT2w=}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PATH: ${ADMIN_PATH:-xuadmin}
      RUST_LOG: ${RUST_LOG:-info}
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 8000
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY:-ZuVdZ0uqaLYeICWBVMmm39yKiy63sE7HW9vpISsIT2w=}
      ROCKET_ENV: ${ROCKET_ENV:-development}
    ports:
      - "8093:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
